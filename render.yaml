services:
  - type: web
    name: repair-system-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_HOST
        fromDatabase:
          name: repair-system-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: repair-system-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: repair-system-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: repair-system-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: repair-system-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://repair-system-frontend.onrender.com
      - key: APP_BUSINESS_TIME_ZONE
        value: Asia/Tashkent
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: true
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_FULL_NAME
        value: System Administrator
      - key: APP_OPENAPI_ENABLED
        value: false
      - key: APP_SWAGGER_UI_ENABLED
        value: false
      - key: APP_STORAGE_ENABLED
        value: false
      - key: APP_STORAGE_ENDPOINT
        sync: false
      - key: APP_STORAGE_REGION
        value: us-east-1
      - key: APP_STORAGE_BUCKET
        sync: false
      - key: APP_STORAGE_ACCESS_KEY
        sync: false
      - key: APP_STORAGE_SECRET_KEY
        sync: false
      - key: APP_STORAGE_PATH_STYLE
        value: true
      - key: APP_STORAGE_CREATE_BUCKET
        value: false
      - key: APP_TELEGRAM_ENABLED
        value: true
      - key: APP_TELEGRAM_CUSTOMER_BOT_TOKEN
        sync: false
      - key: APP_TELEGRAM_CUSTOMER_WEBHOOK_SECRET
        sync: false
      - key: APP_TELEGRAM_CUSTOMER_BOT_USERNAME
        value: repairauto_bot
      - key: APP_TELEGRAM_TECHNICIAN_BOT_TOKEN
        sync: false
      - key: APP_TELEGRAM_TECHNICIAN_WEBHOOK_SECRET
        sync: false
      - key: APP_TELEGRAM_TECHNICIAN_BOT_USERNAME
        value: repairauto_staff_bot
      - key: APP_TELEGRAM_CUSTOMER_LOGIN_CLIENT_ID
        sync: false
      - key: APP_TELEGRAM_TECHNICIAN_LOGIN_CLIENT_ID
        sync: false
      - key: APP_FIREBASE_ENABLED
        value: false
      - key: APP_FIREBASE_PROJECT_ID
        sync: false
      - key: APP_FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

  - type: web
    name: repair-system-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./repairSystem/Dockerfile
    dockerContext: ./repairSystem
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NUXT_BACKEND_URL
        value: https://repair-system-backend.onrender.com
      - key: NUXT_PUBLIC_REALTIME_URL
        value: wss://repair-auto.onrender.com/ws

databases:
  - name: repair-system-db
    plan: free
    databaseName: repair_auto
    user: repair_auto
    postgresMajorVersion: "17"
