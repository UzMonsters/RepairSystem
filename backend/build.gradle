plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.darks'
version = '0.0.1-SNAPSHOT'
description = 'repair-auto'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awssdk:s3:2.30.31'
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'app.firebase.enabled', 'false'
    systemProperty 'app.storage.enabled', 'false'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def pitestTargets = providers.gradleProperty('pitestTargetClasses')
        .map { value -> value.split(',').collect { target -> target.trim() }.findAll { !it.isBlank() } }
        .orElse([
                'com.example.darks.repair_auto.identity.*',
                'com.example.darks.repair_auto.notification.*',
                'com.example.darks.repair_auto.repair.*',
                'com.example.darks.repair_auto.telegram.*',
        ])

def pitestTests = providers.gradleProperty('pitestTargetTests')
        .map { value -> value.split(',').collect { target -> target.trim() }.findAll { !it.isBlank() } }
        .orElse(['com.example.darks.repair_auto.*'])

pitest {
    targetClasses = pitestTargets.get()
    targetTests = pitestTests.get()
    junit5PluginVersion = '1.2.3'
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 0
    coverageThreshold = 0
    threads = 4
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dapp.firebase.enabled=false',
            '-Dapp.storage.enabled=false',
    ]
}

checkstyle {
    toolVersion = '11.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.named('check') {
    dependsOn jacocoTestReport
}
