services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repair_auto}
      POSTGRES_USER: ${POSTGRES_USER:-repair_auto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repair_auto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repair_auto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-repairauto}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - repair_auto_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repair_auto}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-repair_auto}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-repair_auto}
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-false}
      APP_SWAGGER_UI_ENABLED: ${APP_SWAGGER_UI_ENABLED:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-local-only-jwt-secret-that-is-long-enough-for-hs256-please-change}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-repair-auto}
      APP_JWT_ACCESS_TOKEN_TTL: ${APP_JWT_ACCESS_TOKEN_TTL:-PT15M}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-P30D}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
      APP_STORAGE_ENABLED: ${APP_STORAGE_ENABLED:-true}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://minio:9000}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-repairauto-private}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-repairauto}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-change-me-minio-secret}
      APP_STORAGE_PATH_STYLE: ${APP_STORAGE_PATH_STYLE:-true}
      APP_STORAGE_CREATE_BUCKET: ${APP_STORAGE_CREATE_BUCKET:-true}
      APP_STORAGE_DOWNLOAD_URL_TTL: ${APP_STORAGE_DOWNLOAD_URL_TTL:-PT10M}
      APP_STORAGE_MAX_FILE_SIZE: ${APP_STORAGE_MAX_FILE_SIZE:-10MB}
      APP_STORAGE_MAX_REQUEST_SIZE: ${APP_STORAGE_MAX_REQUEST_SIZE:-12MB}
      APP_STORAGE_MAX_FILES_PER_REQUEST: ${APP_STORAGE_MAX_FILES_PER_REQUEST:-30}
      APP_STORAGE_MAX_FILES_PER_TYPE: ${APP_STORAGE_MAX_FILES_PER_TYPE:-10}
      APP_TELEGRAM_ENABLED: ${APP_TELEGRAM_ENABLED:-false}
      APP_TELEGRAM_BOT_TOKEN: ${APP_TELEGRAM_BOT_TOKEN:-}
      APP_TELEGRAM_WEBHOOK_SECRET: ${APP_TELEGRAM_WEBHOOK_SECRET:-}
      APP_TELEGRAM_BOT_USERNAME: ${APP_TELEGRAM_BOT_USERNAME:-repairauto_bot}
      APP_TELEGRAM_API_BASE_URL: ${APP_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      APP_TELEGRAM_FILE_BASE_URL: ${APP_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org}
      APP_TELEGRAM_REQUEST_TIMEOUT: ${APP_TELEGRAM_REQUEST_TIMEOUT:-PT10S}
      APP_TELEGRAM_MAX_PENDING_PHOTOS: ${APP_TELEGRAM_MAX_PENDING_PHOTOS:-3}
      APP_NOTIFICATION_WORKER_ENABLED: ${APP_NOTIFICATION_WORKER_ENABLED:-true}
      APP_NOTIFICATION_POLL_INTERVAL: ${APP_NOTIFICATION_POLL_INTERVAL:-PT5S}
      APP_NOTIFICATION_BATCH_SIZE: ${APP_NOTIFICATION_BATCH_SIZE:-50}
      APP_NOTIFICATION_PROCESSING_LEASE: ${APP_NOTIFICATION_PROCESSING_LEASE:-PT2M}
      APP_NOTIFICATION_MAX_ATTEMPTS: ${APP_NOTIFICATION_MAX_ATTEMPTS:-8}
      APP_NOTIFICATION_INITIAL_BACKOFF: ${APP_NOTIFICATION_INITIAL_BACKOFF:-PT10S}
      APP_NOTIFICATION_MAX_BACKOFF: ${APP_NOTIFICATION_MAX_BACKOFF:-PT30M}
      APP_DASHBOARD_BUSINESS_TIME_ZONE: ${APP_DASHBOARD_BUSINESS_TIME_ZONE:-Asia/Tashkent}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  repair_auto_postgres:
  repair_auto_minio:
