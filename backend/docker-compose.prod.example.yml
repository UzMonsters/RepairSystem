services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - repair_auto_postgres:/var/lib/postgresql/data
    networks:
      - repair_auto_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - repair_auto_minio:/data
    networks:
      - repair_auto_private
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: repairauto-backend:${REPAIRAUTO_IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/repairauto:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
      APP_STORAGE_ENABLED: "true"
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://minio:9000}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY}
      APP_STORAGE_CREATE_BUCKET: ${APP_STORAGE_CREATE_BUCKET:-false}
      APP_TELEGRAM_ENABLED: ${APP_TELEGRAM_ENABLED}
      APP_TELEGRAM_CUSTOMER_BOT_TOKEN: ${APP_TELEGRAM_CUSTOMER_BOT_TOKEN:-}
      APP_TELEGRAM_CUSTOMER_WEBHOOK_SECRET: ${APP_TELEGRAM_CUSTOMER_WEBHOOK_SECRET:-}
      APP_TELEGRAM_CUSTOMER_BOT_USERNAME: ${APP_TELEGRAM_CUSTOMER_BOT_USERNAME:-repairauto_bot}
      APP_TELEGRAM_TECHNICIAN_BOT_TOKEN: ${APP_TELEGRAM_TECHNICIAN_BOT_TOKEN:-}
      APP_TELEGRAM_TECHNICIAN_WEBHOOK_SECRET: ${APP_TELEGRAM_TECHNICIAN_WEBHOOK_SECRET:-}
      APP_TELEGRAM_TECHNICIAN_BOT_USERNAME: ${APP_TELEGRAM_TECHNICIAN_BOT_USERNAME:-repairauto_staff_bot}
      APP_BUSINESS_TIME_ZONE: Asia/Tashkent
      APP_DASHBOARD_BUSINESS_TIME_ZONE: ${APP_DASHBOARD_BUSINESS_TIME_ZONE:-Asia/Tashkent}
      APP_DB_POOL_MAX_SIZE: ${APP_DB_POOL_MAX_SIZE:-10}
    networks:
      - repair_auto_private
      - repair_auto_public
    ports:
      - "${SERVER_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  repair_auto_postgres:
  repair_auto_minio:

networks:
  repair_auto_private:
    internal: true
  repair_auto_public:
