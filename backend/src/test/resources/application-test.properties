spring.application.name=repair-auto-test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
app.cors.allowed-origins=http://localhost:3000
app.jwt.secret=${APP_JWT_SECRET:test-environment-jwt-secret-change-through-env}
app.jwt.issuer=repair-auto
app.jwt.access-token-ttl=PT15M
app.jwt.mobile-audience=repair-auto-mobile
app.bootstrap-admin.enabled=false
spring.main.allow-bean-definition-overriding=true

