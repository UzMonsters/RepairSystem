spring.application.name=repair-auto
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repair_auto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:repair_auto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:repair_auto}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=RepairAuto
info.app.phase=1

spring.jackson.time-zone=UTC
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

springdoc.api-docs.enabled=${APP_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Trace-Id
app.cors.exposed-headers=X-Trace-Id
app.cors.allow-credentials=false
app.trace.header-name=X-Trace-Id
logging.pattern.level=%5p [traceId:%X{traceId:-}]

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=${APP_JWT_ISSUER:repair-auto}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TOKEN_TTL:PT15M}
app.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:P30D}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
