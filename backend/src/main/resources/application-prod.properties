springdoc.api-docs.enabled=${APP_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_SWAGGER_UI_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.allow-credentials=false
app.storage.create-bucket=${APP_STORAGE_CREATE_BUCKET:false}
app.business-time-zone=${APP_BUSINESS_TIME_ZONE:Asia/Tashkent}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.storage.enabled=${APP_STORAGE_ENABLED:true}
app.storage.endpoint=${APP_STORAGE_ENDPOINT}
app.storage.region=${APP_STORAGE_REGION}
app.storage.bucket=${APP_STORAGE_BUCKET}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY}
app.dashboard.business-time-zone=${APP_DASHBOARD_BUSINESS_TIME_ZONE:${APP_BUSINESS_TIME_ZONE:Asia/Tashkent}}
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
