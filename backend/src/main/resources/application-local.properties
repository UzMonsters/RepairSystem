spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repair_auto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:repair_auto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:repair_auto}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:local-only-jwt-secret-that-is-long-enough-for-development-use}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
app.storage.enabled=${APP_STORAGE_ENABLED:false}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:repairauto}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:local-minio-secret}
app.business-time-zone=${APP_BUSINESS_TIME_ZONE:Asia/Tashkent}
app.dashboard.business-time-zone=${APP_DASHBOARD_BUSINESS_TIME_ZONE:${APP_BUSINESS_TIME_ZONE:Asia/Tashkent}}
