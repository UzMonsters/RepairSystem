services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repair_auto}
      POSTGRES_USER: ${POSTGRES_USER:-repair_auto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repair_auto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repair_system_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repair_auto}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-repair_auto}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-repair_auto}
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-false}
      APP_SWAGGER_UI_ENABLED: ${APP_SWAGGER_UI_ENABLED:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-local-only-jwt-secret-that-is-long-enough-for-hs256-please-change}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-repair-auto}
      APP_JWT_ACCESS_TOKEN_TTL: ${APP_JWT_ACCESS_TOKEN_TTL:-PT15M}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-P30D}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
      APP_TELEGRAM_ENABLED: ${APP_TELEGRAM_ENABLED:-false}
      APP_TELEGRAM_CUSTOMER_BOT_TOKEN: ${APP_TELEGRAM_CUSTOMER_BOT_TOKEN:-}
      APP_TELEGRAM_CUSTOMER_WEBHOOK_SECRET: ${APP_TELEGRAM_CUSTOMER_WEBHOOK_SECRET:-}
      APP_TELEGRAM_CUSTOMER_BOT_USERNAME: ${APP_TELEGRAM_CUSTOMER_BOT_USERNAME:-repairauto_bot}
      APP_TELEGRAM_TECHNICIAN_BOT_TOKEN: ${APP_TELEGRAM_TECHNICIAN_BOT_TOKEN:-}
      APP_TELEGRAM_TECHNICIAN_WEBHOOK_SECRET: ${APP_TELEGRAM_TECHNICIAN_WEBHOOK_SECRET:-}
      APP_TELEGRAM_TECHNICIAN_BOT_USERNAME: ${APP_TELEGRAM_TECHNICIAN_BOT_USERNAME:-repairauto_staff_bot}
      APP_TELEGRAM_API_BASE_URL: ${APP_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      APP_TELEGRAM_FILE_BASE_URL: ${APP_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org}
      APP_TELEGRAM_REQUEST_TIMEOUT: ${APP_TELEGRAM_REQUEST_TIMEOUT:-PT10S}
      APP_TELEGRAM_MAX_PENDING_PHOTOS: ${APP_TELEGRAM_MAX_PENDING_PHOTOS:-3}
      APP_STORAGE_ENABLED: ${APP_STORAGE_ENABLED:-true}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://minio:9000}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-repairauto-local}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-minioadmin}
      APP_STORAGE_PATH_STYLE: ${APP_STORAGE_PATH_STYLE:-true}
      APP_STORAGE_CREATE_BUCKET: ${APP_STORAGE_CREATE_BUCKET:-true}
      APP_STORAGE_DOWNLOAD_URL_TTL: ${APP_STORAGE_DOWNLOAD_URL_TTL:-PT10M}
      APP_STORAGE_MAX_FILE_SIZE: ${APP_STORAGE_MAX_FILE_SIZE:-10MB}
      APP_STORAGE_MAX_REQUEST_SIZE: ${APP_STORAGE_MAX_REQUEST_SIZE:-12MB}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9007}:9000"
      - "${MINIO_CONSOLE_PORT:-9008}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${MINIO_PORT:-9007}/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./repairSystem
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  repair_system_postgres:
  minio_data:
